# PlexyDM Display Manager Configuration
# /etc/plexy-dm/plexy-dm.conf

[General]
# Default desktop session to launch
DefaultSession=plexydesk

# Auto-login user (leave empty to disable)
AutoLoginUser=

# Delay before auto-login (seconds)
AutoLoginDelay=0

# VT for the greeter display
GreeterVT=1

# Enable NumLock on greeter startup
NumLock=on

[Security]
# UID range for visible login users
MinUID=1000
MaxUID=60000

# Allow root login on the greeter
AllowRoot=false

[Lock]
# Idle timeout before locking sessions (seconds, 0 = disabled)
IdleTimeout=300

# Lock all sessions before system suspend
LockOnSuspend=true

[Appearance]
# Fallback wallpaper image. The 2D greeter prefers plexyshell.conf
# [background] wallpaper_path when available.
# If the path points to a video file (.mp4, .mkv, .webm, etc.) the
# greeter will loop it as an animated video wallpaper.
Background=/opt/plexydesk/current/share/plexydesk/background/wallpaper.jpeg

# Greeter theme fallback. Enable the 3D cube from plexyshell.conf with
# [display_manager] enable_3d_login_theme = true.
Theme=2d

# Show user list on the greeter
ShowUserList=true

# Show hostname on the greeter
ShowHostname=true

# Use 24-hour clock format
Clock24h=false

[Weather]
# Drive the greeter wallpaper effect from current weather via wttr.in.
# Empty Location uses wttr.in's IP-based location; set a city or "lat,lon"
# if the network location is wrong.
Enabled=true
Location=Stockholm
RefreshMinutes=30

[Session]
# Session launcher script (resolved under RuntimeRoot/lib/plexydesk/)
SessionExec=plexydesk-dm-session

# PlexyShell runtime root (auto-detected if empty)
RuntimeRoot=/opt/plexydesk/current
